<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Babylon.js 粒子系统演示</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; touch-action: none; position: absolute; top: 0; left: 0; z-index: 0; }
        #controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 15px; border-radius: 8px; z-index: 1000; min-width: 280px; max-height: 90vh; overflow-y: auto; z-index: 1000; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; }
        select, input[type="range"] { width: 100%; margin-bottom: 5px; }
        .value-display { font-size: 12px; color: #aaa; margin-bottom: 8px; }
        button { background: #ff9800; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #f57c00; }
        .preset-buttons { margin-bottom: 15px; }
        h3 { margin: 0 0 15px 0; color: #ff9800; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="controls">
        <h3>✨ 粒子系统演示</h3>

        <div class="preset-buttons">
            <button onclick="setPreset('fire')">🔥 火焰</button>
            <button onclick="setPreset('smoke')">💨 烟雾</button>
            <button onclick="setPreset('explosion')">💥 爆炸</button>
            <button onclick="setPreset('rain')">🌧️ 下雨</button>
            <button onclick="setPreset('snow')">❄️ 下雪</button>
            <button onclick="setPreset('sparkle')">✨ 星光</button>
            <button onclick="emitBurst()">💫 一次性爆发</button>
        </div>

        <div class="control-group">
            <label for="emissionRate">发射速率</label>
            <input type="range" id="emissionRate" min="10" max="1000" step="10" value="100">
            <div class="value-display" id="emissionRateValue">100 / 秒</div>
        </div>

        <div class="control-group">
            <label for="particleLife">粒子生命周期</label>
            <input type="range" id="particleLife" min="0.1" max="5" step="0.1" value="1">
            <div class="value-display" id="particleLifeValue">1 秒</div>
        </div>

        <div class="control-group">
            <label for="particleSize">粒子大小</label>
            <input type="range" id="particleSize" min="0.01" max="1" step="0.01" value="0.1">
            <div class="value-display" id="particleSizeValue">0.1</div>
        </div>

        <div class="control-group">
            <label for="gravity">重力系数</label>
            <input type="range" id="gravity" min="-10" max="10" step="0.1" value="-1">
            <div class="value-display" id="gravityValue">-1</div>
        </div>

        <div class="control-group">
            <label for="velocity">初速度</label>
            <input type="range" id="velocity" min="0.1" max="10" step="0.1" value="2">
            <div class="value-display" id="velocityValue">2</div>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        let scene, camera, particleSystem, emitter;
        let currentPreset = 'fire';

        const createScene = async () => {
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.1, 1);

            // 相机
            camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 10, new BABYLON.Vector3(0, 2, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 5;
            camera.upperRadiusLimit = 30;

            // 灯光
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            light.intensity = 0.6;

            // 地面
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.15);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            ground.material = groundMat;

            // 发射器
            emitter = BABYLON.MeshBuilder.CreateBox("emitter", {size: 0.1}, scene);
            emitter.position.y = 0.1;
            emitter.isVisible = false;

            // 创建粒子系统
            particleSystem = new BABYLON.ParticleSystem("particles", 2000, scene);
            particleSystem.particleTexture = new BABYLON.Texture("https://raw.githubusercontent.com/BabylonJS/Babylon.js/master/packages/tools/playground/public/textures/flare.png", scene);
            particleSystem.emitter = emitter;

            // 绑定控件
            bindControls();

            // 默认加载火焰效果
            setPreset('fire');

            return scene;
        };

        function bindControls() {
            // 发射速率
            const emissionRate = document.getElementById('emissionRate');
            const emissionRateValue = document.getElementById('emissionRateValue');
            emissionRate.addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                emissionRateValue.textContent = value + ' / 秒';
                particleSystem.emitRate = value;
            });

            // 生命周期
            const particleLife = document.getElementById('particleLife');
            const particleLifeValue = document.getElementById('particleLifeValue');
            particleLife.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                particleLifeValue.textContent = value + ' 秒';
                particleSystem.minLifeTime = value * 0.8;
                particleSystem.maxLifeTime = value * 1.2;
            });

            // 粒子大小
            const particleSize = document.getElementById('particleSize');
            const particleSizeValue = document.getElementById('particleSizeValue');
            particleSize.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                particleSizeValue.textContent = value;
                particleSystem.minSize = value * 0.8;
                particleSystem.maxSize = value * 1.2;
            });

            // 重力
            const gravity = document.getElementById('gravity');
            const gravityValue = document.getElementById('gravityValue');
            gravity.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                gravityValue.textContent = value;
                particleSystem.gravity = new BABYLON.Vector3(0, value, 0);
            });

            // 速度
            const velocity = document.getElementById('velocity');
            const velocityValue = document.getElementById('velocityValue');
            velocity.addEventListener('input', (e) => {
                const value = parseFloat(e.target.value);
                velocityValue.textContent = value;
                particleSystem.minEmitPower = value * 0.8;
                particleSystem.maxEmitPower = value * 1.2;
            });
        }

        function setPreset(preset) {
            currentPreset = preset;
            particleSystem.reset();

            switch(preset) {
                case 'fire':
                    particleSystem.emitRate = 300;
                    particleSystem.minLifeTime = 0.5;
                    particleSystem.maxLifeTime = 1.5;
                    particleSystem.minSize = 0.1;
                    particleSystem.maxSize = 0.5;
                    particleSystem.gravity = new BABYLON.Vector3(0, -0.5, 0);
                    particleSystem.minEmitPower = 1;
                    particleSystem.maxEmitPower = 3;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(1, 0.5, 0, 1));
                    particleSystem.addColorGradient(0.5, new BABYLON.Color4(1, 0.2, 0, 0.8));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(0, 0, 0, 0));
                    particleSystem.direction1 = new BABYLON.Vector3(-0.5, 2, -0.5);
                    particleSystem.direction2 = new BABYLON.Vector3(0.5, 3, 0.5);
                    break;

                case 'smoke':
                    particleSystem.emitRate = 100;
                    particleSystem.minLifeTime = 2;
                    particleSystem.maxLifeTime = 4;
                    particleSystem.minSize = 0.3;
                    particleSystem.maxSize = 1;
                    particleSystem.gravity = new BABYLON.Vector3(0, 1, 0);
                    particleSystem.minEmitPower = 0.5;
                    particleSystem.maxEmitPower = 1.5;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(0.2, 0.2, 0.2, 0.6));
                    particleSystem.addColorGradient(0.5, new BABYLON.Color4(0.4, 0.4, 0.4, 0.4));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(0.5, 0.5, 0.5, 0));
                    particleSystem.direction1 = new BABYLON.Vector3(-0.2, 1, -0.2);
                    particleSystem.direction2 = new BABYLON.Vector3(0.2, 2, 0.2);
                    break;

                case 'explosion':
                    particleSystem.emitRate = 0; // 爆发模式
                    particleSystem.minLifeTime = 0.5;
                    particleSystem.maxLifeTime = 1.5;
                    particleSystem.minSize = 0.2;
                    particleSystem.maxSize = 0.8;
                    particleSystem.gravity = new BABYLON.Vector3(0, -2, 0);
                    particleSystem.minEmitPower = 5;
                    particleSystem.maxEmitPower = 10;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(1, 0.8, 0, 1));
                    particleSystem.addColorGradient(0.3, new BABYLON.Color4(1, 0.3, 0, 0.8));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(0.1, 0.1, 0.1, 0));
                    particleSystem.direction1 = new BABYLON.Vector3(-5, 5, -5);
                    particleSystem.direction2 = new BABYLON.Vector3(5, 10, 5);
                    particleSystem.manualEmitCount = 500; // 一次性发射500个
                    break;

                case 'rain':
                    particleSystem.emitRate = 500;
                    particleSystem.minLifeTime = 1;
                    particleSystem.maxLifeTime = 3;
                    particleSystem.minSize = 0.02;
                    particleSystem.maxSize = 0.05;
                    particleSystem.gravity = new BABYLON.Vector3(0, -10, 0);
                    particleSystem.minEmitPower = 0;
                    particleSystem.maxEmitPower = 0;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(0.2, 0.5, 1, 0.8));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(0.2, 0.5, 1, 0.2));
                    particleSystem.createPointEmitter(new BABYLON.Vector3(-10, 10, -10), new BABYLON.Vector3(10, 10, 10));
                    particleSystem.direction1 = new BABYLON.Vector3(0, -1, 0);
                    particleSystem.direction2 = new BABYLON.Vector3(0, -1, 0);
                    break;

                case 'snow':
                    particleSystem.emitRate = 200;
                    particleSystem.minLifeTime = 3;
                    particleSystem.maxLifeTime = 6;
                    particleSystem.minSize = 0.05;
                    particleSystem.maxSize = 0.15;
                    particleSystem.gravity = new BABYLON.Vector3(0, -0.5, 0);
                    particleSystem.minEmitPower = 0;
                    particleSystem.maxEmitPower = 0;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(1, 1, 1, 0.9));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(1, 1, 1, 0.1));
                    particleSystem.createPointEmitter(new BABYLON.Vector3(-10, 10, -10), new BABYLON.Vector3(10, 10, 10));
                    particleSystem.direction1 = new BABYLON.Vector3(-0.2, -0.5, -0.2);
                    particleSystem.direction2 = new BABYLON.Vector3(0.2, -1, 0.2);
                    break;

                case 'sparkle':
                    particleSystem.emitRate = 400;
                    particleSystem.minLifeTime = 0.5;
                    particleSystem.maxLifeTime = 1.5;
                    particleSystem.minSize = 0.05;
                    particleSystem.maxSize = 0.2;
                    particleSystem.gravity = new BABYLON.Vector3(0, 1, 0);
                    particleSystem.minEmitPower = 2;
                    particleSystem.maxEmitPower = 4;
                    particleSystem.addColorGradient(0, new BABYLON.Color4(1, 0.8, 0, 1));
                    particleSystem.addColorGradient(0.5, new BABYLON.Color4(0, 0.8, 1, 0.8));
                    particleSystem.addColorGradient(1, new BABYLON.Color4(0.5, 0, 1, 0));
                    particleSystem.direction1 = new BABYLON.Vector3(-1, 2, -1);
                    particleSystem.direction2 = new BABYLON.Vector3(1, 3, 1);
                    break;
            }

            // 更新控件显示
            updateControlsFromParticleSystem();
            particleSystem.start();
        }

        function emitBurst() {
            particleSystem.manualEmitCount = 200;
        }

        function updateControlsFromParticleSystem() {
            document.getElementById('emissionRate').value = particleSystem.emitRate;
            document.getElementById('emissionRateValue').textContent = particleSystem.emitRate + ' / 秒';

            const life = (particleSystem.minLifeTime + particleSystem.maxLifeTime) / 2;
            document.getElementById('particleLife').value = life;
            document.getElementById('particleLifeValue').textContent = life.toFixed(1) + ' 秒';

            const size = (particleSystem.minSize + particleSystem.maxSize) / 2;
            document.getElementById('particleSize').value = size;
            document.getElementById('particleSizeValue').textContent = size.toFixed(2);

            document.getElementById('gravity').value = particleSystem.gravity.y;
            document.getElementById('gravityValue').textContent = particleSystem.gravity.y.toFixed(1);

            const power = (particleSystem.minEmitPower + particleSystem.maxEmitPower) / 2;
            document.getElementById('velocity').value = power;
            document.getElementById('velocityValue').textContent = power.toFixed(1);
        }

        createScene().then((scene) => {
            engine.runRenderLoop(() => {
                scene.render();
            });

            window.addEventListener('resize', () => {
                engine.resize();
            });
        });
    </script>
</body>
</html>
